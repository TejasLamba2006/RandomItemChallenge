    # Uncomment these if you want spawn eggs disabled
    # - CREEPER_SPAWN_EGG
    # - ZOMBIE_SPAWN_EGG
    # - etc.

# ===========================================
# ITEM QUANTITY SETTINGS
# ===========================================
quantity:
  # Use random quantity for stackable items
  random-quantity: true
  
  # Minimum items in stack (for random)
  min: 1
  
  # Maximum items in stack (for random)
  max: 16
  
  # Fixed quantity if random-quantity is false
  fixed: 1

# ===========================================
# ENCHANTMENT SETTINGS
# ===========================================
enchantments:
  # Chance to add random enchantments (0.0 to 1.0)
  chance: 0.1
  
  # Max number of enchantments to add
  max-enchants: 2
  
  # Max enchantment level (capped at item's max)
  max-level: 3
  
  # Allow treasure enchantments (mending, frost walker, etc.)
  allow-treasure: false

# ===========================================
# DELIVERY SETTINGS
# ===========================================
delivery:
  # How to give items: INVENTORY, DROP, or HOTBAR
  # INVENTORY - Add to inventory, drop if full
  # DROP - Always drop at player's feet
  # HOTBAR - Try to add to hotbar first
  method: INVENTORY
  
  # Play sound when receiving item
  sound:
    enabled: true
    type: ENTITY_ITEM_PICKUP
    volume: 1.0
    pitch: 1.2
  
  # Show particle effect
  particles:
    enabled: true
    type: HAPPY_VILLAGER
    count: 10
  
  # Show message when receiving item
  show-message: true
  
  # Show action bar instead of chat
  use-action-bar: true

# ===========================================
# PLAYER SETTINGS
# ===========================================
players:
  # Only give to players in survival mode
  survival-only: true
  
  # Only give to players in specific worlds
  world-whitelist-enabled: false
  world-whitelist:
    - world
    - world_nether
    - world_the_end
  
  # Minimum players required to run
  min-players: 1

# ===========================================
# GAME SETTINGS
# ===========================================
game:
  # Broadcast when challenge starts/stops
  broadcast-toggle: true
  
  # Show countdown before next item (action bar)
  show-countdown: true
  
  # Show title on start
  show-title-on-start: true
  
  title:
    main: "&a&lRANDOM ITEMS!"
    sub: "&7A new item every {interval} seconds!"
    fade-in: 10
    stay: 40
    fade-out: 10

# ===========================================
# MESSAGES
# ===========================================
messages:
  prefix: "&8[&a&lRIC&8] &7"
  started: "&aRandom Item Challenge has &lSTARTED&a!"
  stopped: "&cRandom Item Challenge has &lSTOPPED&c."
  already-running: "&cChallenge is already running!"
  not-running: "&cChallenge is not running!"
  skipped: "&eSkipped to next item drop!"
  interval-changed: "&eInterval changed to &f{interval}&e seconds."
  interval-current: "&7Current interval: &f{interval}&7 seconds."
  received-item: "&aYou received: &f{item} x{amount}"
  reload: "&aConfiguration reloaded!"
  no-permission: "&cYou don't have permission to do that!"
  invalid-number: "&cPlease enter a valid number!"

# ===========================================
# ADVERTISEMENT
# ===========================================
show-advertisement: true
