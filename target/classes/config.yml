# RandomItemChallenge Configuration
# Give players random items periodically!

# ===========================================
# GENERAL SETTINGS
# ===========================================

# Plugin enabled on server start
enabled: false

# Interval between random items in seconds
interval: 30

# Number of items to give each interval
items-per-drop: 1

# ===========================================
# ITEM SOURCE SETTINGS
# ===========================================
items:
