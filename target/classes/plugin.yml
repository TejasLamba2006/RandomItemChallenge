name: RandomItemChallenge
version: 1.0.0
main: com.github.tejaslamba2006.randomitemchallenge.RandomItemChallenge
api-version: "1.21"
authors: [TejasLamba2006]
description: Periodically gives all players random items for survival challenges
website: https://github.com/TejasLamba2006/RandomItemChallenge

commands:
  randomitemchallenge:
    description: Main command for RandomItemChallenge
    usage: /<command> <start|stop|skip|interval|reload>
    aliases: [ric, randomitem, itemchallenge]
    permission: randomitemchallenge.admin

permissions:
  randomitemchallenge.admin:
    description: Access to all admin commands
    default: op
  randomitemchallenge.receive:
    description: Receive random items
    default: true
  randomitemchallenge.bypass:
    description: Bypass receiving items (for spectators)
    default: false
